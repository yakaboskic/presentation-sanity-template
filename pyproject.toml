[project]
name = "presentation-sanity-template"
version = "0.1.0"
description = "Starter deck for presentation-sanity. Clone or use as a GitHub template."
requires-python = ">=3.10"
# Default install does NOT pull manim — pre-rendered videos in public/manim/
# travel with the deck, so a deploy environment doesn't need cairo/pango/etc.
# If you want to render scenes locally, use the `manim` extra:
#   uv add "presentation-sanity[manim] @ git+https://github.com/yakaboskic/presentation-sanity.git@main"
dependencies = [
    "presentation-sanity @ git+https://github.com/yakaboskic/presentation-sanity.git@main",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true   # the template has no importable Python
