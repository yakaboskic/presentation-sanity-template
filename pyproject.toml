[project]
name = "presentation-sanity-template"
version = "0.1.0"
description = "Starter project for presentation-sanity: many presentations sharing one manifest. Clone or use as a GitHub template."
requires-python = ">=3.10"
# presentation-sanity is pinned to a release tag, so every clone builds with
# the same tool. To upgrade, change the tag below to a newer release
# (https://github.com/yakaboskic/presentation-sanity/releases) and run `uv lock`.
#
# The [manim] extra is on by default, so `build` renders scenes/*.py into
# public/manim/ (the machine needs ffmpeg, cairo, pango and LaTeX). For a
# deploy environment without those, drop `[manim]`: build then skips rendering
# and uses whatever videos are already in public/manim/.
dependencies = [
    "presentation-sanity[manim] @ git+https://github.com/yakaboskic/presentation-sanity.git@v0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true   # the template has no importable Python
