[project]
name = "presentation-sanity-template"
version = "0.1.0"
description = "Starter deck for presentation-sanity. Clone or use as a GitHub template."
requires-python = ">=3.10"
dependencies = [
    "presentation-sanity[manim] @ git+https://github.com/yakaboskic/presentation-sanity.git@main",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true   # the template has no importable Python
