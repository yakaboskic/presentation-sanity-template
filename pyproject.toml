[project]
name = "presentation-sanity-template"
version = "0.1.0"
description = "Demo deck for presentation-sanity. Eventually extracted to its own repo."
requires-python = ">=3.10"
dependencies = [
    "presentation-sanity[manim]",
]

[tool.uv.sources]
# While the template is nested inside the presentation-sanity repo, point
# directly at the parent. When the template is extracted to its own repo,
# replace this with `{ git = "https://github.com/.../presentation-sanity.git" }`.
presentation-sanity = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true   # the template has no importable Python
